[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pillarscan"
version = "0.1.0"
description = "Read-only AWS posture scanner across the Security, Reliability and Cost Optimization pillars."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    # Lets boto3 read the short-lived credentials that `aws login` creates.
    "botocore[crt]",
    "pytest>=8",
    "moto[autoscaling,awslambda,cloudtrail,dynamodb,ec2,elbv2,guardduty,iam,logs,rds,s3,s3control,sts]>=5",
]

[tool.setuptools.packages.find]
include = ["scanner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
