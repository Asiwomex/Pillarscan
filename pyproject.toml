[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pillarscan"
version = "0.1.0"
description = "Read-only AWS posture scanner across the Security, Reliability and Cost Optimization pillars."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "moto[ec2,iam,sts]>=5",
]

[tool.setuptools.packages.find]
include = ["scanner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
